# Phase 1 Configuration — Multimodal Brand Collaboration Recommendation System
# Integrated AI Stack: YOLO-World (logo) + YOLOv8x (objects) + DINOv2 (visual
# embeddings) + PaddleOCR + Whisper ASR + BEATs audio events + Qwen3-VL 32B
# (central vision, gated) + category-affinity knowledge graph.

layer1:
  object_detection:
    model: "yolov8x.pt"  # YOLOv8x — generic scene objects (COCO classes)
    confidence_threshold: 0.25
    iou_threshold: 0.45
    # Open-vocabulary scene object detection (zero-shot, ADDITIONAL pass — never
    # a replacement for the COCO pass). YOLO-World promotes curated product
    # labels (wristwatch, wireless earbuds, sneaker, ...) that the fixed COCO
    # vocabulary cannot represent — a wristwatch is misread as 'cell phone'/
    # 'person'. On high-IoU overlap the curated label WINS over the COCO label
    # for that region (merge rule, not a shape/aspect-ratio heuristic), and
    # every detection is tagged detection_source ("coco"|"open_vocab").
    # Provenance tags are informational and never influence matching.
    open_vocab:
      enabled: true
      model: "yolov8s-worldv2.pt"  # zero-shot weights (present at repo root)
      confidence_threshold: 0.25
      min_merge_iou: 0.4     # IoU at which the curated label replaces the COCO label
      max_frames: 30         # cap on open-vocab frames (scene-change keyframes)
      text_queries:
        - "wristwatch"
        - "smartwatch"
        - "digital watch"
        - "wireless earbuds"
        - "earbuds with charging case"
        - "headphones"
        - "wall clock"
        - "sneaker"
        - "fitness tracker"
        - "smart ring"
        - "sunglasses"
        - "smartphone"

  logo_detection:
    # NOTE: The RF-DETR backend is NOT wired into the pipeline loader (the only
    # runnable backend is yolo_world via src/layer1/logo_detector.py) and its
    # weights (weights/rfdetr_logo_detector.pt) are not present in the repo.
    # Pointing config at 'rfdetr' previously made every upload fail with
    # "Unknown logo detection backend: 'rfdetr'". Until RF-DETR is properly
    # integrated + weights shipped, the shipped default remains YOLO-World
    # (yolov8s-worldv2.pt is present at repo root).
    # "yolo" = trained single-class detector (LogoDet-3K, real photos).
    # "yolo_world" = zero-shot prompted fallback, kept for comparison.
    #
    # PERFORMANCE, and read this before trusting any number attached to it.
    # P/R/F1 from benchmark/results/detector_val.json (weights/logo_detector
    # val, IoU 0.5, single class "logo"). boxes/frame and crops->OCR/frame are
    # measured separately over the 36 annotated val frames, with the shipped
    # crop gates applied (max_logo_area_fraction 0.50, max_crop_aspect 3.0,
    # min_crop_area 3000) -- those two columns count what actually reaches OCR.
    #
    #   conf   P       R       F1     boxes/frame   crops->OCR/frame
    #   0.05   0.198   0.232   0.214        82.9            40.3
    #   0.10   0.253   0.119   0.162        42.6            19.7   <- was shipped
    #   0.20   0.320   0.038   0.069        11.8             ~5
    #   0.25   0.374   0.026   0.049         5.9             2.1   <- now
    #   0.30   0.396   0.015   0.029         3.2             1.2
    #
    # COST, honestly. Every box surviving the crop gates becomes a crop-OCR
    # call, and crop-OCR is what pinned a worker at ~107% CPU on the 18-minute
    # job. 0.10 -> 0.25 cuts that work 9.2x, and 0.10 -> 0.30 cuts it 16.5x.
    #
    # WHAT THAT COSTS. Recall drops 0.119 -> 0.026 at 0.25, i.e. ~4.5x less,
    # so the detector now sees about 2.6% of labelled logo boxes instead of
    # 12%. That is the real trade, not a free speedup: fewer logos reach
    # crop-OCR at all, so there is proportionally less for it to find. Since
    # every downstream gate is fail-closed, the practical effect is fewer
    # logo-sourced brands overall, not more false ones.
    #
    # 0.10 is not the F1 optimum either -- 0.05 beats it (0.214 vs 0.162) --
    # so 0.10 was not chosen on merit; it looks like recall bought at any
    # price, and at 0.10 it buys 0.119 for 9x the work. 0.25 is a deliberate
    # cost decision on a detector that is not good enough to be worth that
    # work yet. If logo recall starts to matter more than job latency, move
    # this back toward 0.10 and accept the runtime.
    #
    # THE REAL CEILING IS THE TRAINING DATA, not this threshold. Overall recall
    # is 0.23 at the F1-optimal 0.05, and 0.063 on tiny+small boxes, which are
    # 28% of the ground truth. Cause: LogoDet boxes form a nested containment
    # hierarchy flattened into a flat list. In labels/train/1.txt, 1653 boxes of
    # which ZERO survive a 0.95 containment filter, and the 311 boxes wider
    # than half the frame have median pairwise IoU 0.68. YOLO cannot represent
    # nested boxes -- those are mutually contradictory assignment targets -- so
    # the objective is unsatisfiable and the best the model can do is emit the
    # container scale, which is what it does.
    #
    # DO NOT RETRAIN ON SANITISED LogoDet. Measured 2026-10-05 by running
    # scripts/sanitize_dataset.py report-only over all three splits:
    # 157,056 boxes in -> 520 kept (0.3%) across 162 images, verdict
    # "UNUSABLE ... do not retrain on this". Retraining on ~500 boxes would be
    # worse than the current weights. The earlier OpenLogo fine-tune attempt
    # already collapsed for the same reason: benchmark/results/mix_val_cand.json
    # shows mAP50 0.0 and AUROC 0.46 against 0.116 / 0.816 for the base
    # (mix_val_base.json) -- below chance on separation.
    #
    # The fix is real human-labelled VIDEO data, not more compute:
    # scripts/label_frames.py --frames <dir> --out <labels.jsonl>, then --export.
    # Only retrain once that pool carries positive boxes from more than one
    # video; a single-video pool cannot separate logo presence from that video's
    # lighting and framing.
    backend: "yolo"  # "yolo" (trained) | "yolo_world" (zero-shot)
    model: "weights/logo_detector/train/weights/best.pt"
    confidence_threshold: 0.25
    sampling_strategy: "scene_change"  # "stride" | "detection_gated" | "scene_change" | "all"
    max_logo_candidates: 30  # max frames for detection-gated sampling; caps workload for dense/long videos
    # Generic fallback queries. The pipeline automatically merges these with
    # '<Brand> logo' queries generated from the brand catalog (src/brand_catalog.py)
    # so known brands are matched zero-shot. Crop-OCR then resolves the actual name.
    #
    # region_proposal_only: DETECT and IDENTIFY as separate jobs. When true, the
    # detector sees ONLY the generic queries below and proposes "a logo is here";
    # identity is decided downstream by crop-OCR and CLIP retrieval
    # (src/layer2/brand_resolver.py), both already fail-closed. A brand name
    # taken from a detector class label is never evidence.
    #
    # MEASURED on 30 real LogoDet-3K test frames / 41 logo boxes
    # (scripts/eval_logo.py, no resolver, IoU 0.5):
    #
    #   classes                     conf>=0.10   TP   FP   FN      P      R     F1
    #   45 (6 generic + 39 brand)      ON         3   99   38  0.029  0.073  0.042
    #   6  (generic only)              ON         0    2   41  0.000  0.000  0.000
    #
    # So YOLO-World is not usable as a logo detector EITHER way: the brand
    # prompts buy 3 true positives at the cost of 99 false ones, and the
    # generic prompts find nothing at all. Removing the brand prompts is the
    # architecturally correct end state, but on its own it only trades false
    # positives for zero recall. It stays default-OFF until a detector trained
    # on real logo boxes replaces the open-vocabulary prompt (see
    # scripts/train_logo_detector.py); turning it on before then is a silent
    # recall regression, not a fix.
    region_proposal_only: false
    text_queries:
      - "brand logo"
      - "company logo"
      - "text logo"
      - "product logo"
      - "label"
      - "wordmark"
    # Brand-resolution gate (Layer 2c): a per-brand class label ('Samsung logo')
    # from YOLO-World is only trusted as brand evidence above this confidence.
    # Below it the label is treated as a possible false positive (YOLOv8s-World
    # emits spurious low-confidence brand hits, e.g. 'SUPREME logo' on Samsung/
    # Sony/Apple logos) and resolution falls through to crop-OCR for proof.
    class_confidence: 0.40
    # Class-label corroboration gate (Phase 1 precision fix, third trust-class
    # alongside the CLIP margin guard and the OCR screen-content gate). A brand
    # asserted from YOLO-World's zero-shot class label ALONE (small spurious
    # 'GUCCI logo' / 'REEBOK logo' / 'SUPREME logo' boxes at confidence just
    # above class_confidence, with no readable OCR text and no retrieval match)
    # is a fabricated DIRECT recommendation — observed across two different
    # videos. When enabled, an uncorroborated class label is NOT asserted as a
    # brand; it is tagged class_unconfirmed and left unresolved (fail-closed,
    # no fabrication). Requires an independent signal (clean CLIP-retrieval
    # match naming the same brand; OCR would already have caught a wordmark).
    class_require_corroboration: True
    # Crop upscale factor applied before OCR so small/low-res logo text reads.
    crop_scale: 2.0
    # Full-frame editorial-box gate (Phase 1 precision fix, same trust-class as
    # the CLIP margin guard). A genuine brand wordmark occupies a compact region
    # of the frame; a detection box covering more than max_logo_area_fraction of
    # frame area is a title card / full-screen editorial / screen recording, NOT
    # a brand appearance. OCR over such a box reads the surrounding scene text
    # (e.g. a news headline whose body mentions "Google") and resolving it to a
    # brand yields a false DIRECT recommendation (observed: a ~0.58-frame-area
    # box whose title text resolved to GOOGLE). Oversized boxes are suppressed
    # fail-closed and tagged editorial_box so they never become evidence.
    max_logo_area_fraction: 0.50   # >50% of frame area => treat as full-frame editorial
    # Multiline-brand-card OCR superset. When a tight proposal box wraps only one
    # line of a multi-line card (e.g. the lower 'Gen 5' of a 'Snapdragon / 8 Elite
    # / Gen 5' chip card), OCR on that tight crop reads a fragment matching no
    # catalog brand. The resolver then retries OCR on a padded superset, biased
    # upward (where the missing wordmark line usually sits), sized by
    # superset_margin_ratio * box-dimension. Higher = larger superset, more likely
    # to capture a split wordmark, but with a slightly higher bleed risk.
    superset_margin_ratio: 0.45
    # OCR-context screen-content gate (Phase 1 precision fix, same trust-class
    # as the CLIP margin guard). A phone video shows the DEVICE with its own on
    # screen UI — app drawer, Messages/2FA screen, camera watermark — and YOLO
    # flags those screen regions as logos while OCR reads app names off them,
    # yielding a "brand" (META/GOOGLE/SUPREME) that is content, not appearance.
    # When enabled, an OCR-resolved crop that also reads phone-screen/app-drawer
    # text (play store / instagram / messages / creative studio ...) is suppressed
    # fail-closed: brand stays None so it never becomes evidence/DIRECT rec.
    screen_content_filter:
      enabled: True
    # Temporal brand-resolution smoothing (Phase 1 stability fix). A static
    # on-screen overlay (wordmark / chip card held for many frames) gets
    # region-proposal confidence that flaps around the cut-off, so the same
    # pixels resolve a brand one frame and 'text logo'/nothing the next. When
    # enabled, a brand that resolves solidly and persistently on a stable
    # spatial region (>= min_votes overlapping frames within `window`) back-fills
    # the unresolved logo boxes in that region, so the resolution stays stable
    # instead of flickering. Never weakens an already-resolved brand.
    temporal_smoothing:
      enabled: True
      window: 2        # max frame-distance for a brand to back-fill a neighbour
      min_iou: 0.3     # spatial overlap required to treat two boxes as the same region
      min_votes: 2     # min supporting resolved frames to apply a back-fill brand
      # UNKNOWN-BRAND grouping (limitation #5): the same spatial thresholds drive
      # the clustering of logos that still fail to resolve. A persistent-but-
      # unnameable mark collapses into ONE 'UNKNOWN BRAND' region (full extent +
      # frame span) instead of N nameless boxes, kept strictly out of evidence/
      # recommendations.
      merge_iou: 0.3   # IoU a detection needs for a region to absorb it
      max_frame_gap: 2 # max skipped frames a detection may still join a region

  # CLIP logo-retrieval index (Phase 1/2 — the brand-resolution precision fix).
  # YOLO-World is weak on icon-only / stylized marks where there is no text for
  # OCR to rescue, and can confidently mislabel such marks (SUPREME on Samsung).
  # This makes CLIP embedding retrieval against a per-brand reference bank the
  # PRIMARY classifier for the icon-only case: crop -> CLIP embed -> nearest
  # reference logo -> brand. OCR still wins when it reads a wordmark; retrieval
  # fires only when OCR finds none (see src/layer2/brand_resolver.py).
  # reference_dir: benchmark/reference_logos_bank  # per-brand subdirectories
  logo_retrieval:
    enabled: True
    # Reference bank: a directory with one subdirectory per canonical brand
    # (SUB_DIR = brand name, e.g. SAMSUNG/, APPLE/, ...). If this dir is absent
    # the pipeline falls back to the flat benchmark/reference_logos (grouped by
    # <BRAND>_N.png filename). Fail-closed: no bank => no retrieval.
    # Built from the LogoDet-3K train split by scripts/build_train_bank.py.
    reference_dir: "benchmark/reference_logos_bank/reference"
    min_similarity: 0.22   # min CLIP cosine to accept a retrieval candidate (absolute floor)
    # min_margin: top-1 vs top-2 (distinct-brand) similarity gap required to trust
    # the top retrieval as a genuine match. Tuned on a real 65s foldable-video run:
    # ALL 124 noise hits had margin <= 0.052 (86/124 <= 0.02) — random brand
    # matches cluster at 0.7-0.9 with no gap to a genuine wordmark signal, so a
    # floor raise alone cannot separate them. A real match has a wide margin
    # (e.g. SAMSUNG 0.9 / others 0.3). 0.10 cleanly clears the observed noise
    # (max 0.052) while keeping high-margin genuine matches.
    min_margin: 0.10
    # checkpoint_path: ""  # optional open_clip ViT-B/32 weights; uses built-in CLIP otherwise

  # Spatial / temporal label stabilization for scene objects (secondary
  # remediation). The COCO object detector flips the label of one physical
  # device across adjacent frames; this smooths those flips and tags object
  # detections that overlap a resolved brand's on-screen location with the
  # brand context (see src/layer2/spatial_label.py).
  spatial_label:
    window: 3              # max frame-distance for brand->object spatial tag
    min_iou: 0.05          # overlap for an object box to be tagged by a brand
    track_distance_factor: 0.6  # spatial-track match threshold (x box size)
    min_track_len: 2       # min frames in a track for its label to be smoothed
    # Phase 3 — brand-anchored contradiction correction (SceneConsistencyResolver).
    # A detection anchored to a resolved brand whose COCO label is implausible for
    # that brand (e.g. mouse/remote/backpack on a Samsung phone) is reclassified to
    # the brand's primary product, keeping raw_class for audit.
    min_brand_confidence: 0.30    # resolution confidence required to auto-correct
    min_detection_confidence: 0.10

  # Central multimodal understanding: Qwen3-VL 32B handles video, OCR, and reasoning in one pass
  central_vision_model:
    backend: "qwen3vl"  # "qwen3vl" | "dinov2"
    # enable_qwen: when True, Qwen3-VL is allowed to run. It is gated at runtime
    # by a frame-selection filter (see pipeline) so it only analyzes frames where
    # logo/object detection or OCR already fired — empty/background frames are
    # skipped. The loader in src/layer1/qwen3vl.py FAILS CLOSED (returns fallback
    # dicts, no real inference — it cannot even send frames to the model), so this
    # stays OFF: enabling it changes nothing today and only misleads dashboards.
    enable_qwen: false
    model: "Qwen3-VL-32B"
    load_8bit: True  # Use 8-bit quantization for memory efficiency on Apple Silicon
    device: null  # auto-detect (mps/cuda/cpu)

  # Legacy speech-to-text (maintained for backward compatibility)
  speech_to_text:
    model: "medium"
    compute_dtype: "int8"  # faster-whisper INT8 quantization (CPU-efficient)
    # Brand-mention detection settings (multilingual, see src/brand_catalog.py):
    # The brand-name source is the shared catalog (src/brand_catalog.py) — the
    # SAME list that drives logo-detection text queries and the knowledge graph.
    # Exact word-boundary matching (any script, incl. Devanagari aliases) is
    # always on. Fuzzy/phonetic matching is OPT-IN and defaults OFF so it can
    # never silently inflate speech evidence with distance-1 near-matches.
    mention_fuzzy: false
    mention_max_distance: 1

  # BEATs audio event detector (supplementary)
  audio_events:
    # Fine-tuned 527-class AudioSet tagging head (sigmoid probabilities per
    # chunk) — real per-class events for cue mapping, unlike the feature-
    # extractor checkpoint. Downloaded by scripts/download_models.py from the
    # HuggingFace mirror (microsoft UNILM Azure links are unreliable); the
    # pipeline degrades gracefully to the feature extractor when absent.
    checkpoint: "BEATs_iter3_plus_AS2M_finetuned_on_AS2M_cpt2.pt"
    sample_rate: 16000
    embedding_dim: 256  # 128 mel bins × 2 stats (mean + std)
    # Max BEATs chunks processed per video (each chunk = 30 s of audio).
    # null = decode the WHOLE audio (legacy behavior). That is brutally slow on
    # long videos: ~100 chunks for a 50-minute upload at ~12 s/chunk on MPS =
    # 20+ minutes of wall time in this one stage (measured: job BNVRDTNO-X9J53
    # sat silent for 21 min after all other models finished).
    # A number caps the pass with UNIFORM sampling across the full duration:
    # first and last chunk always included, real BEATs inference, real
    # timestamps — just fewer chunks. Audio events are supplementary evidence
    # (their strength is hard-capped at 0.4 in the Layer 2b scorer), so 20
    # chunks (~10 min of audio spread across the whole video) preserves the
    # signal while bounding this stage to ~2-3 minutes.
    max_chunks: 20

  visual_embeddings:
    model: "facebook/dinov3-vitb16-pretrain-lvd1689m"
    output_dim: 768

  # Product-catalog visual search (Phase 2.5): DINOv2 frame embeddings are run
  # through cosine nearest-neighbor search against a reference index of brand
  # product/logo images. FAILS CLOSED: with no reference images in reference_dir
  # the index stays empty and visual_product_match evidence is 0 — no fabricated
  # matches. The reference set is benchmark/reference_logos_bank/reference (the
  # per-brand logo.dev bank, 16 catalog brands / ~500 images) laid out one
  # subdir per canonical catalog brand; the index falls back to the flat legacy
  # benchmark/reference_logos ('<BRAND>_<n>.png', 4 brands) when the bank is
  # absent.
  product_index:
    reference_dir: "benchmark/reference_logos_bank/reference"
    top_k: 1
    # DINOv2 cosine threshold for product-catalog matching. 0.80 is very
    # strict — it requires near-identical visual appearance between the video
    # frame and the reference product image. Lowering to 0.65 allows matching
    # products that look similar but aren't pixel-identical (different angle,
    # lighting, product variant). Still rejects random matches (noise clusters
    # below 0.5).
    similarity_threshold: 0.65

  # Tiered product→brand resolution (Layer 2b). Replaces the (rejected)
  # practice of hardcoding product/device names as brand aliases: a product
  # name read on screen or spoken (e.g. "Mac Mini", "Z Fold 8 Ultra", "पिक्सेर")
  # resolves to its parent brand via Wikidata (Tier 2) or cross-video learned
  # co-occurrence (Tier 4), with a low-trust Qwen3-VL fallback (Tier 3).
  # Every resolution records resolution_tier + source; provenance is additive
  # and never influences matching. Fails closed by default (no API key needed).
  product_resolution:
    enable_speech: true          # resolve product names in ASR transcripts too
    enable_ocr_evidence: true    # route full-frame OCR through resolver for ocr_hit
    endpoint: "https://query.wikidata.org/sparql"
    cache_path: "data/product_resolution_cache.json"   # auditable local cache
    memory_path: "data/product_resolution_memory.json" # Tier-4 learned table
    min_interval_sec: 1.0        # rate-limit between Wikidata queries
    timeout_sec: 10.0
    min_plausibility: 0.5        # boost gate before spending Tier 2/3 queries
    enable_qwen: false           # Tier 3 (requires local Qwen weights)
    qwen_max_calls_per_video: 10 # Tier-3 budget gate
    min_distinct_videos: 3       # Tier-4 promotion threshold (>=3 distinct videos)

  ocr:
    # OCR script/language. Default now targets the stress-test domain: a Hindi
    # broadcast with mixed Devanagari + Latin on-screen text (tickers, product
    # labels). "hi" is passed to both OCR backends (PaddleOCR multi-language and
    # the Free.ai cloud OCR fallback); index-2-script coverage means Devanagari
    # AND Latin wordmarks both get read, so a Devanagari brand alias still
    # resolves to a catalog brand.
    lang: "hi"
    use_angle_cls: True
    det_db_thresh: 0.3
    rec_batch_num: 64
    cpu_threads: 10          # physical core count — PaddleOCR runs on CPU
    max_frames: 30  # max frames to run OCR on (sampled uniformly from detections)

  # Free.ai API (OCR, STT, Vision) — optional cloud fallback.
  # Requires FREE_AI_API_KEY in .env (30K free tokens/day, no credit card).
  # When the heavy local models (PaddleOCR/Whisper) fail to load, the pipeline
  # uses Free.ai's cloud API ONLY when BOTH enabled AND fallback are true —
  # uploading a creator's frames/audio to a third party is an explicit consent
  # decision, so the shipped default is opt-in (off).
  freeai:
    enabled: false
    fallback: false  # set BOTH true to allow cloud fallback on local-model failure
    base_url: "https://api.free.ai/v1"

layer2a:
  fusion:
    hidden_dim: 512
    num_heads: 8
    num_layers: 3
    dropout: 0.1
    use_learned_gating: True  # vs fixed heuristic
    # Optional path to trained gating/fusion weights (output of
    # scripts/train_gating.py). Empty = randomly initialized.
    checkpoint: ""

    # Modality quality signal sources for fusion
    quality_sources:
      audio: "quality_estimator"  # AudioQualityEstimator
      video: "quality_estimator"  # VideoQualityEstimator

layer2b:
  # Evidence sources: weight + status (implemented | scaffolded).
  # Scaffolded sources contribute zero and are excluded from scoring;
  # implemented-source weights are renormalized to sum to 1.0 so
  # that strong evidence from the available sources can reach a fair
  # confidence score.
  #
  # Weights are calibrated for 5 implemented visual/audio signals (not the
  # original 3): logo carries the most weight, visual product-catalog match
  # (Phase 2.5) sits below direct logo since similarity is weaker than an
  # identified on-screen logo, and audio_event (Phase 2.6, jingles/cues) is
  # the weakest since it hints at ad-like content without naming a brand.
  evidence_sources:
    # Logo detection evidence — brand-resolved on-screen logo boxes
    logo_detected:
      weight: 0.30
      status: implemented  # YOLO-World logo detector + brand resolution
    # Speech mention evidence
    speech_mention:
      weight: 0.20
      status: implemented  # ASR transcript -> brand-catalog mention detection
    # OCR evidence — full-frame/object-region + logo-crop OCR folded together
    ocr_hit:
      weight: 0.18
      status: implemented  # PaddleOCR within video frames
    # Visual product-catalog match (Phase 2.5) — DINOv2 NN against product index
    visual_product_match:
      weight: 0.18
      status: implemented  # product-index cosine similarity (fails closed to 0)
    # Audio-event branding cue (Phase 2.6) — BEATs jingle/ad-cue mapping
    audio_event:
      weight: 0.10
      status: implemented  # BEATs audio-event -> brand-cue mapping
    # Scene context evidence — derived from audio-event RMS energy and event
    # density. When BEATs detects non-speech audio activity (music, jingles,
    # ambient cues), the mean confidence × count factor provides a scene-level
    # signal that ad-like or brand-relevant audio is present. Capped at 0.4
    # by _audio_branding_strength so it never dominates direct visual/speech
    # proof; the raw scene_context strength (before cap) reaches ~0.9 on
    # videos with sustained audio events.
    scene_context:
      weight: 0.05
      status: implemented  # audio-event RMS energy + event density
    product_retrieval:
      weight: 0.0
      status: scaffolded  # reserved for product-retrieval evidence

  aggregation: "weighted_sum"  # weighted_sum | learned_calibration | noisy_or
  min_evidence_threshold: 0.55

  # Object/event evidence tracking (Phase 5). Per-frame logo detections are
  # associated across frames into physical-object tracks, so a static overlay
  # held for many frames contributes ONE evidence track (best observation +
  # mean quality + persistence) rather than N correlated per-frame votes.
  # Association is label-agnostic (boxes only) and greedy (ByteTrack-style: it
  # associates every box, including low-confidence ones, to avoid fragmenting
  # a trajectory). See src/layer2/evidence_tracking.py.
  tracking:
    enabled: true
    iou_threshold: 0.3   # min IoU for a detection to join an existing track
    max_gap: 2           # max skipped frames a detection may join across

  # Candidate generation funnel (Phase 5). Evidence used to feed candidate
  # scores directly; now a generator proposes candidates from OCR/ASR aliases,
  # logo retrieval and product matches, fusion scores only the top-K, and the
  # verdict ranks the top-5. Bounds the fusion search space and stops a flood
  # of weak generated names from diluting the winner.
  candidate_generation:
    enabled: true
    top_k: 20            # candidates handed to fusion (0 = no gating)

  # Compiled multimodal fusion (candidate-centric, dependency-aware).
  # Replaces naive weighted-sum with temporal grounding + dependency discount
  # + agreement bonus + conflict/abstain verdict + temperature-scaled prob.
  fusion:
    enabled: True
    # Power scaling: prob ** (1/temperature), so >1 RAISES prob toward 1
    # (sharper) and <1 lowers it. The opposite of softmax(z/T), where >1
    # flattens — do not read this as a conventional temperature. It is applied
    # BEFORE margin/verdict, so it moves the accept/abstain boundary, not just
    # the reported confidence. 1.0 = identity; fusion_eval/calibration.py fits
    # a value but nothing writes it back here, so serving is uncalibrated.
    temperature: 1.0
    time_bucket_seconds: 2.0  # correlation window for the dependency discount
    agreement_bonus: 0.30   # bonus on cross-modal temporal agreement
    accept: 0.30            # below this, top candidate -> low_support verdict
    margin_min: 0.15        # top-vs-2nd margin below this -> ambiguous verdict
    # Weight applied to a candidate's contradiction score when computing net
    # evidence (support - penalty * contradiction); <1 so a rival sighting
    # erodes but does not single-handedly erase strong supporting evidence.
    contradiction_penalty: 0.5
    # Cross-modal contradiction mining: file one-sided modality conflicts as
    # negative evidence against the candidate they disagree with (product
    # retrieval vs wordmark identity; ASR vs visual). A rival seen in BOTH audio
    # and video is treated as consistent, not contradictory, so multi-brand
    # videos do not self-penalise.
    cross_modal_contradiction:
      enabled: true
      min_product_similarity: 0.6  # rival product match strong enough to count
      min_visual_strength: 0.5     # visual proof strong enough to contradict audio-only

layer2c:
  # Temporal memory / cross-scene reasoning (brand entity timeline).
  enabled: True

  # Cross-video brand entity memory (Phase 2). Resolved brands are committed to
  # an in-memory bank persisted to `memory_path`, and indirect ASR references
  # ("this phone" / "our foldable") that contain no brand token are resolved
  # against that bank via recency-weighted confidence + optional embedding sim.
  memory_enabled: True
  memory_path: "brand_memory.json"  # resolved relative to repo/config dir

  # Qwen3-VL timeline reasoning enhancement
  vl_reasoning: True  # Enable Qwen3-VL-based temporal brand reasoning

layer3:
  # Recommendation engine — knowledge graph + ranked, explainable output.
  top_k: 12
  category_affinity: 0.7  # strength multiplier for adjacent (never-appeared) brands
  # Learned creator-brand affinity (Phase 2, LightGCN). The pipeline accepts a
  # fitted affinity_model via set_affinity_model(); when present and the creator
  # is known, its score is blended into ranking by affinity_blend, else the
  # category/evidence heuristic is used (honest cold start).
  affinity_blend: 0.5

  # Qwen3-VL embeddings for knowledge graph
  vl_embedding_dim: 1024  # Qwen3-VL fused embedding dimension

layer2d:
  # Creator profiling + niche-suppression gate (Phase 2).
  # A SUGGESTED collaboration whose brand's category is a poor fit for the
  # creator's recurring content (e.g. 'wore Nike once, content is cooking') is
  # downweighted by suppress_factor when its niche-fit share is below threshold.
  niche_threshold: 0.15
  suppress_factor: 0.5

logo_dev:
  # B2a reference bank: official logo.dev logos for catalog brands, used as the
  # visual reference set for region-proposal + CLIP retrieval detection.
  # B2b brand validation: logo.dev is the authoritative existence check that
  # blocks fabricated brand names from reaching outreach. Keys come from the
  # environment or .env (NEVER committed — see .env.example + .gitignore).
  reference_bank_dir: "benchmark/reference_logos"
  reference_logo_size: 256
  timeout_seconds: 10
  enabled: true

open_set:
  # Open-set brand identification (escalation Task 3) — real, grounded
  # identification of brands outside the fixed catalogue. Logo-shaped regions
  # from the primary detector become unknown-brand candidates that go through a
  # REAL reverse-image search on the actual crop + logo.dev external validation,
  # with the full evidence trail recorded. This NEVER falls back to an LLM
  # guess; without a runnable backend it fails closed (no names surfaced).
  # Every tunable lives here — the code reads config and fails closed if any
  # key is missing. There are no hardcoded fallback values in src/openset.py.
  enabled: true
  # Whether creator frames may be UPLOADED to a third-party reverse-image
  # search API. Separate from `enabled`, which only controls whether the
  # open-set block runs at all.
  #
  # This is the same consent decision as freeai below: a crop is the
  # creator's own image leaving the machine. Detection, the local crop cache
  # and the whole evidence trail still run with this false — only the outbound
  # call is withheld, so nothing about a creator's video is disclosed unless an
  # operator explicitly chooses to disclose it.
  #
  # Shipped default is OFF. Set true only after deciding that uploading
  # customer video frames to Google/Bing/SerpAPI is acceptable.
  consent_upload: false
  # backend: google_vision_web | bing_visual | serpapi | browser_grounded | gemini_grounded
  # browser_grounded drives a real reverse-image search through the agent-browser
  # CLI (no paid API key required). gemini_grounded uses Google Gemini's free
  # tier with the built-in google_search tool (real, citable results; needs a
  # free GEMINI_API_KEY from aistudio.google.com). The shipped default is
  # gemini_grounded — free and returns grounded sources — with browser_grounded
  # kept as the keyless fallback when agent-browser is installed.
  # Keyed backends unlock via their env var in .env (see .env.example):
  #   google_vision_web -> GOOGLE_CLOUD_VISION_API_KEY
  #   bing_visual       -> BING_VISUAL_SEARCH_KEY
  #   serpapi           -> SERPAPI_KEY (+ public image host)
  #   gemini_grounded   -> GEMINI_API_KEY (or ~/.gemini_key; model via GEMINI_MODEL)
  backend: "gemini_grounded"
  # Only logo detections with REAL model confidence at/above this threshold
  # become candidates — this is the documented cost guard against calling the
  # (billable) reverse-image API on the detector's confidence noise floor.
  # REVERTED 0.10 → 0.30 and 12 → 5 pending a labeled precision/recall
  # comparison. The relaxation contradicted the documented precision-over-recall
  # design principle (ARCHITECTURE_AND_RESEARCH.md §6, §10) and shipped without
  # benchmark data; it must earn its way back with evidence, not demo vibes.
  min_logo_confidence: 0.30
  # Editorial search-crop gates. A crop is only ever sent to the (billable)
  # reverse-image API if it is large enough and shaped like a logo, not like a
  # full-width news/broadcast strap. Both gates also surface their rejected
  # crops (with the exact pixel dims and reason) in the open-set block so a
  # skipped frame is never a silent blank. Sourced from the real stress-video
  # audit: 985px² text crop (frame 10), 58 365px² TSMC title (kept), 81 658px²
  # ASUS/MSI strap at aspect 3.35, and 75 872px² CNBC strap at aspect 4.31 —
  # so min_crop_area 3000 + max_crop_aspect 3.0 keeps only ABOVE-the-noise,
  # logo-shaped crops.
  # minimum crop pixel area (w*h) to be searchable
  min_crop_area: 3000
  # maximum bbox/crop aspect (w/h); wider = ticker/strap, not a searchable logo
  max_crop_aspect: 3.0
  # REPORTING ONLY - a frame with at least this many logo proposals is flagged
  # as saturated in the dashboard's detector diagnostics. It never drops,
  # reorders or caps a candidate; the funnel of zeros is a detector diagnosis,
  # and hiding proposals to make the count look tidy would destroy the evidence
  # for it. Measured on 7864fa1c52 (98 frames, human labels): 112 proposals per
  # frame on frames WITH a logo, 62 on frames WITHOUT, p50 confidence 0.148 vs
  # 0.143. Confidence barely separates the two, so the confidence gate rejects
  # a flat noise floor - the gates are working, the detector is not.
  # 30 is well below the worst observed per-frame count, so a saturated frame is
  # reported rather than tuned to look rare.
  saturated_proposals_per_frame: 30
  # Hard cap on reverse-image + logo.dev calls per video.
  max_candidates_per_video: 5
  crop_cache_dir: "static/openset_crops"
  # Engine wordmark/object tags that must NEVER be derived into a brand
  # candidate (generic descriptors such as "logo", "tshirt", "логотип").
  # Data-driven filter vocabulary — not a brand list.
  generic_tag_filter:
    - "logo"
    - "logos"
    - "brand"
    - "brands"
    - "label"
    - "labels"
    - "icon"
    - "icons"
    - "badge"
    - "badges"
    - "text"
    - "wordmark"
    - "design"
    - "graphic"
    - "symbol"
    - "sign"
    - "emblem"
    - "mark"
    - "sticker"
    - "print"
    - "tshirt"
    - "t-shirt"
    - "tee"
    - "принт"
    - "наклейка"
    - "логотип"
    - "лого"
    - "бренд"
    - "бренды"
    - "иконка"
    - "значок"
    - "знак"
    - "эмблема"
    - "дизайн"
    - "мода"
    - "одежда"
    - "стили логотипа"
    - "иконка оперы"
    - "иконка браузер"
    - "значок opera"
    - "футболка"
    - "футболки"
    - "мужской футболка"
    - "футболка для тренировок"
    - "футболки для мужчин"
    - "футболки и майки"
    - "футболки дизайн"
  # Result domains that must NEVER be derived into a candidate name (search
  # engines, social portals, generic aggregators). Data-driven — not hardcoded.
  generic_domain_filter:
    - "google.com"
    - "google.ru"
    - "lens.google.com"
    - "bing.com"
    - "facebook.com"
    - "twitter.com"
    - "x.com"
    - "pinterest.com"
    - "youtube.com"
    - "instagram.com"
    - "wikipedia.org"
    - "w3.org"
    - "schema.org"
    - "creativecommons.org"
  logodev_timeout: 10

ui:
  # PART A INCIDENT CONTAINMENT — outreach (DRAFT EMAIL / email generation /
  # forward) was feature-flagged OFF until the brand-collaboration data path was
  # verified end-to-end. It has been re-enabled (outreach_enabled: true) at the
  # user's request. NOTE: the runtime still enforces a hard external-verification
  # gate — _validate_brand must return status "verified", which requires a real
  # LOGO_DEV_SECRET_KEY in .env. Without a valid key the route fails closed
  # (BRAND NOT EXTERNALLY VERIFIED), so no fabricated brand can reach a draft.
  outreach_enabled: true
  outreach_reason: "OUTREACH ENABLED — DRAFT EMAIL LIVE (requires LOGO_DEV_SECRET_KEY for brand verification)"

  # Gemini-grounded brand email lookup: for each brand detected ON SCREEN, ask
  # Gemini (google_search grounding) for the brand's official public contact and
  # HR/careers addresses as published on real pages. Fail-closed: ON without a
  # GEMINI_API_KEY yields no emails (catalog placeholders stay), and an address
  # is only surfaced if it came with real grounding evidence (never invented).
  # Emails found this way are always labeled UNVERIFIED in the UI.
  gemini_email_lookup: true

auth:
  # Phase 3 SaaS dashboard login. DEFAULT OFF so the standalone/desktop server
  # and existing tests behave exactly as before. When enabled, the /api/jobs,
  # /api/pipeline/<id>, and /api/outreach/* routes require a session token
  # obtained from POST /api/login. The admin password is PBKDF2-hashed in memory
  # and should be supplied via the ADSCENE_ADMIN_PASSWORD env var (or
  # admin_password here — prefer env for secrets, never commit a real one).
  enabled: false
  admin_user: "admin"
  admin_password: ""            # prefer ADSCENE_ADMIN_PASSWORD env var
  session_ttl_seconds: 28800    # 8 hours

store:
  # Phase 3 SQLite persistence for completed jobs (survives server restart).
  # Override at runtime with ADSCENE_DB_PATH.
  db_path: "var/contextlens.db"


evaluation:
  audio_sample_rate: 16000
  video_frame_rate: 1  # frames per second to sample
  max_frames: 300  # absolute maximum frames loaded (prevents OOM on long videos)
  # NOTE: max_frames caps sample DENSITY, not coverage — load_video already
  # strides uniformly across the FULL source duration when the video is longer
  # than max_frames/frame_rate seconds, so the tail is never silently dropped.
  # Audio is NOT truncated (null): a 700s broadcast produces ~45MB of 16kHz
  # float32 audio, and the previous hard 600s `-t` cut ~100s of genuine audio
  # off a real stress video. ffmpeg wall-clock timeout still guards runaway
  # decodes (extract_audio derives it from max_duration when not set).
  max_audio_seconds: null
  extract_audio_timeout: null  # ffmpeg wall-clock timeout (sec); null derives from max_audio_seconds
  batch_size: 32
