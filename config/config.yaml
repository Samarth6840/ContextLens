# Phase 1 Configuration — Multimodal Brand Collaboration Recommendation System
# Integrated AI Stack: YOLO-World (logo) + YOLOv8x (objects) + DINOv2 (visual
# embeddings) + PaddleOCR + Whisper ASR + BEATs audio events + Qwen3-VL 32B
# (central vision, gated) + category-affinity knowledge graph.

layer1:
  object_detection:
    model: "yolov8x.pt"  # YOLOv8x — generic scene objects (COCO classes)
    confidence_threshold: 0.25
    iou_threshold: 0.45

  logo_detection:
    # NOTE: The RF-DETR backend is NOT wired into the pipeline loader (the only
    # runnable backend is yolo_world via src/layer1/logo_detector.py) and its
    # weights (weights/rfdetr_logo_detector.pt) are not present in the repo.
    # Pointing config at 'rfdetr' previously made every upload fail with
    # "Unknown logo detection backend: 'rfdetr'". Until RF-DETR is properly
    # integrated + weights shipped, the shipped default remains YOLO-World
    # (yolov8s-worldv2.pt is present at repo root).
    backend: "yolo_world"  # "yolo_world" (shipped) | "rfdetr" (not yet wired)
    model: "yolov8s-worldv2.pt"  # YOLO-World zero-shot weights (present at repo root)
    confidence_threshold: 0.10
    sampling_strategy: "scene_change"  # "stride" | "detection_gated" | "scene_change" | "all"
    max_logo_candidates: 30  # max frames for detection-gated sampling; caps workload for dense/long videos
    # Generic fallback queries. The pipeline automatically merges these with
    # '<Brand> logo' queries generated from the brand catalog (src/brand_catalog.py)
    # so known brands are matched zero-shot. Crop-OCR then resolves the actual name.
    text_queries:
      - "brand logo"
      - "company logo"
      - "text logo"
      - "product logo"
      - "label"
      - "wordmark"
    # Brand-resolution gate (Layer 2c): a per-brand class label ('Samsung logo')
    # from YOLO-World is only trusted as brand evidence above this confidence.
    # Below it the label is treated as a possible false positive (YOLOv8s-World
    # emits spurious low-confidence brand hits, e.g. 'SUPREME logo' on Samsung/
    # Sony/Apple logos) and resolution falls through to crop-OCR for proof.
    class_confidence: 0.40
    # Crop upscale factor applied before OCR so small/low-res logo text reads.
    crop_scale: 2.0

  # Spatial / temporal label stabilization for scene objects (secondary
  # remediation). The COCO object detector flips the label of one physical
  # device across adjacent frames; this smooths those flips and tags object
  # detections that overlap a resolved brand's on-screen location with the
  # brand context (see src/layer2/spatial_label.py).
  spatial_label:
    window: 3              # max frame-distance for brand->object spatial tag
    min_iou: 0.05          # overlap for an object box to be tagged by a brand
    track_distance_factor: 0.6  # spatial-track match threshold (x box size)
    min_track_len: 2       # min frames in a track for its label to be smoothed

  # Central multimodal understanding: Qwen3-VL 32B handles video, OCR, and reasoning in one pass
  central_vision_model:
    backend: "qwen3vl"  # "qwen3vl" | "dinov2"
    # enable_qwen: when True, Qwen3-VL is allowed to run. It is gated at runtime
    # by a frame-selection filter (see pipeline) so it only analyzes frames where
    # logo/object detection or OCR already fired — empty/background frames are
    # skipped. NOTE: the loader in src/layer1/qwen3vl.py still FAILS CLOSED
    # (returns fallback dicts, no real inference) until the 32B weights are wired.
    enable_qwen: True
    model: "Qwen3-VL-32B"
    load_8bit: True  # Use 8-bit quantization for memory efficiency on Apple Silicon
    device: None  # auto-detect (mps/cuda/cpu)

  # Legacy speech-to-text (maintained for backward compatibility)
  speech_to_text:
    model: "medium"
    compute_dtype: "int8"  # faster-whisper INT8 quantization (CPU-efficient)
    # Brand-mention detection settings (multilingual, see src/brand_catalog.py):
    # The brand-name source is the shared catalog (src/brand_catalog.py) — the
    # SAME list that drives logo-detection text queries and the knowledge graph.
    # Exact word-boundary matching (any script, incl. Devanagari aliases) is
    # always on. Fuzzy/phonetic matching is OPT-IN and defaults OFF so it can
    # never silently inflate speech evidence with distance-1 near-matches.
    mention_fuzzy: false
    mention_max_distance: 1

  # BEATs audio event detector (supplementary)
  audio_events:
    checkpoint: "BEATs_iter3_plus_AS2M.pt"
    sample_rate: 16000
    embedding_dim: 256  # 128 mel bins × 2 stats (mean + std)

  visual_embeddings:
    model: "facebook/dinov2-base"
    output_dim: 768

  # Product-catalog visual search (Phase 2.5): DINOv2 frame embeddings are run
  # through cosine nearest-neighbor search against a reference index of brand
  # product/logo images. FAILS CLOSED: with no reference images in reference_dir
  # the index stays empty and visual_product_match evidence is 0 — no fabricated
  # matches. The reference set is benchmark/reference_logos, laid out either as
  # one subdir per canonical catalog brand OR flat '<BRAND>_<n>.png' files.
  # NOTE: previously pointed at 'benchmark/product_logos' (a dir that does not
  # exist), so the index silently failed closed and visual_product_match was
  # always 0 even though real brand reference images were on disk.
  product_index:
    reference_dir: "benchmark/reference_logos"
    top_k: 1
    similarity_threshold: 0.80

  ocr:
    lang: "en"
    use_angle_cls: True
    det_db_thresh: 0.3
    rec_batch_num: 6
    max_frames: 30  # max frames to run OCR on (sampled uniformly from detections)

layer2a:
  fusion:
    hidden_dim: 512
    num_heads: 8
    num_layers: 3
    dropout: 0.1
    use_learned_gating: True  # vs fixed heuristic
    # Optional path to trained gating/fusion weights (output of
    # scripts/train_gating.py). Empty = randomly initialized.
    checkpoint: ""

    # Modality quality signal sources for fusion
    quality_sources:
      audio: "quality_estimator"  # AudioQualityEstimator
      video: "quality_estimator"  # VideoQualityEstimator

layer2b:
  # Evidence sources: weight + status (implemented | scaffolded).
  # Scaffolded sources contribute zero and are excluded from scoring;
  # implemented-source weights are renormalized to sum to 1.0 so
  # that strong evidence from the available sources can reach a fair
  # confidence score.
  #
  # Weights are calibrated for 5 implemented visual/audio signals (not the
  # original 3): logo carries the most weight, visual product-catalog match
  # (Phase 2.5) sits below direct logo since similarity is weaker than an
  # identified on-screen logo, and audio_event (Phase 2.6, jingles/cues) is
  # the weakest since it hints at ad-like content without naming a brand.
  evidence_sources:
    # Logo detection evidence — brand-resolved on-screen logo boxes
    logo_detected:
      weight: 0.30
      status: implemented  # YOLO-World logo detector + brand resolution
    # Speech mention evidence
    speech_mention:
      weight: 0.20
      status: implemented  # ASR transcript -> brand-catalog mention detection
    # OCR evidence — full-frame/object-region + logo-crop OCR folded together
    ocr_hit:
      weight: 0.18
      status: implemented  # PaddleOCR within video frames
    # Visual product-catalog match (Phase 2.5) — DINOv2 NN against product index
    visual_product_match:
      weight: 0.18
      status: implemented  # product-index cosine similarity (fails closed to 0)
    # Audio-event branding cue (Phase 2.6) — BEATs jingle/ad-cue mapping
    audio_event:
      weight: 0.10
      status: implemented  # BEATs audio-event -> brand-cue mapping
    # Provisionally scaffolded legacy/next sources (excluded from scoring)
    scene_context:
      weight: 0.04
      status: scaffolded  # voxtral realtime scene context (not wired)
    product_retrieval:
      weight: 0.0
      status: scaffolded  # reserved for product-retrieval evidence

  aggregation: "weighted_sum"  # weighted_sum | learned_calibration | noisy_or
  min_evidence_threshold: 0.55

layer2c:
  # Temporal memory / cross-scene reasoning (brand entity timeline).
  enabled: True

  # Qwen3-VL timeline reasoning enhancement
  vl_reasoning: True  # Enable Qwen3-VL-based temporal brand reasoning

layer3:
  # Recommendation engine — knowledge graph + ranked, explainable output.
  top_k: 12
  category_affinity: 0.7  # strength multiplier for adjacent (never-appeared) brands

  # Qwen3-VL embeddings for knowledge graph
  vl_embedding_dim: 1024  # Qwen3-VL fused embedding dimension

logo_dev:
  # B2a reference bank: official logo.dev logos for catalog brands, used as the
  # visual reference set for region-proposal + CLIP retrieval detection.
  # B2b brand validation: logo.dev is the authoritative existence check that
  # blocks fabricated brand names from reaching outreach. Keys come from the
  # environment or .env (NEVER committed — see .env.example + .gitignore).
  reference_bank_dir: "benchmark/reference_logos"
  reference_logo_size: 256
  timeout_seconds: 10
  enabled: true

open_set:
  # Open-set brand identification (escalation Task 3) — real, grounded
  # identification of brands outside the fixed catalogue. Logo-shaped regions
  # from the primary detector become unknown-brand candidates that go through a
  # REAL reverse-image search on the actual crop + logo.dev external validation,
  # with the full evidence trail recorded. This NEVER falls back to an LLM
  # guess; without a runnable backend it fails closed (no names surfaced).
  # Every tunable lives here — the code reads config and fails closed if any
  # key is missing. There are no hardcoded fallback values in src/openset.py.
  enabled: true
  # backend: google_vision_web | bing_visual | serpapi | browser_grounded
  # browser_grounded drives a real reverse-image search through the agent-browser
  # CLI (no paid API key required); the keyed backends unlock via their env vars.
  backend: "browser_grounded"
  # Only logo detections with REAL model confidence at/above this threshold
  # become candidates — this is the documented cost guard against calling the
  # (billable) reverse-image API on the detector's confidence noise floor.
  min_logo_confidence: 0.30
  # Hard cap on reverse-image + logo.dev calls per video.
  max_candidates_per_video: 5
  crop_cache_dir: "static/openset_crops"
  # Engine wordmark/object tags that must NEVER be derived into a brand
  # candidate (generic descriptors such as "logo", "tshirt", "логотип").
  # Data-driven filter vocabulary — not a brand list.
  generic_tag_filter:
    - "logo"
    - "logos"
    - "brand"
    - "brands"
    - "label"
    - "labels"
    - "icon"
    - "icons"
    - "badge"
    - "badges"
    - "text"
    - "wordmark"
    - "design"
    - "graphic"
    - "symbol"
    - "sign"
    - "emblem"
    - "mark"
    - "sticker"
    - "print"
    - "tshirt"
    - "t-shirt"
    - "tee"
    - "принт"
    - "наклейка"
    - "логотип"
    - "лого"
    - "бренд"
    - "бренды"
    - "иконка"
    - "значок"
    - "знак"
    - "эмблема"
    - "дизайн"
    - "мода"
    - "одежда"
    - "стили логотипа"
    - "иконка оперы"
    - "иконка браузер"
    - "значок opera"
    - "футболка"
    - "футболки"
    - "мужской футболка"
    - "футболка для тренировок"
    - "футболки для мужчин"
    - "футболки и майки"
    - "футболки дизайн"
  # Result domains that must NEVER be derived into a candidate name (search
  # engines, social portals, generic aggregators). Data-driven — not hardcoded.
  generic_domain_filter:
    - "google.com"
    - "google.ru"
    - "lens.google.com"
    - "bing.com"
    - "facebook.com"
    - "twitter.com"
    - "x.com"
    - "pinterest.com"
    - "youtube.com"
    - "instagram.com"
    - "wikipedia.org"
    - "w3.org"
    - "schema.org"
    - "creativecommons.org"
  logodev_timeout: 10

ui:
  # PART A INCIDENT CONTAINMENT — outreach (DRAFT EMAIL / email generation /
  # forward) is feature-flagged OFF until the brand-collaboration data path is
  # verified end-to-end. When disabled the server returns 403 and the frontend
  # hides the DRAFT EMAIL controls. Re-enable ONLY after the data-integrity
  # review in MAJOR_REMEDIATION_REPORT.md is signed off.
  outreach_enabled: false
  outreach_reason: "DRAFT EMAIL DISABLED — PENDING DATA-INTEGRITY REVIEW (see MAJOR_REMEDIATION_REPORT.md)"

evaluation:
  audio_sample_rate: 16000
  video_frame_rate: 1  # frames per second to sample
  max_frames: 300  # absolute maximum frames loaded (prevents OOM on long videos)
  max_audio_seconds: 600  # truncate audio beyond this (prevents OOM from 9+ GiB buffers)
  batch_size: 8
