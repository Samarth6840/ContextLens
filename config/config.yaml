# Phase 1 Configuration
# Context-Aware Multimodal Brand Collaboration Recommendation System
# Phase 1: Layer 1 + Layer 2a/2b

paths:
  model_cache: "./models"
  data_root: "./data"
  output_dir: "./outputs"
  test_fixtures: "./tests/fixtures"

layer1:
  object_detection:
    model: "yolov8x.pt"  # YOLOv8x — best available; swap to YOLO26 when released
    confidence_threshold: 0.25
    iou_threshold: 0.45
    device: "cuda"  # fallback to cpu if unavailable

  visual_embeddings:
    model: "facebook/dinov2-large"  # DINOv3 equivalent
    output_dim: 1024
    device: "cuda"

  ocr:
    model: "paddleocr"  # PaddleOCR
    lang: "en"
    use_angle_cls: True
    det_db_thresh: 0.3
    rec_batch_num: 6

  speech_to_text:
    model: "large-v3"  # Whisper large-v3
    device: "cuda"
    compute_dtype: "float16"
    language: null  # auto-detect

  audio_events:
    model: "beats"  # BEATs
    checkpoint: "BEATs_iter3_plus_AS2M.pt"
    device: "cuda"
    sample_rate: 16000

layer2a:
  modality_weights:
    initial_video_weight: 0.5
    initial_audio_weight: 0.5
    min_weight: 0.1
    max_weight: 0.9

  quality_estimation:
    # Audio quality signals
    audio_snr_threshold: 15.0  # dB
    audio_vad_confidence_threshold: 0.6

    # Video quality signals
    blur_threshold: 100.0  # Laplacian variance
    exposure_low: 40.0     # mean pixel value
    exposure_high: 210.0   # mean pixel value
    detection_confidence_variance_window: 10  # frames

  fusion:
    hidden_dim: 512
    num_heads: 8
    num_layers: 3
    dropout: 0.1
    use_learned_gating: True  # vs fixed heuristic

layer2b:
  evidence_weights:
    logo_detected: 0.45
    speech_mention: 0.20
    ocr_hit: 0.15
    scene_context: 0.10
    product_retrieval: 0.10

  aggregation: "weighted_sum"  # weighted_sum | learned_calibration | noisy_or
  min_evidence_threshold: 0.30
  calibration:
    n_bins: 10
    use_reliability_diagrams: True

evaluation:
  audio_sample_rate: 16000
  video_frame_rate: 1  # frames per second to sample
  batch_size: 8
  num_workers: 4
  seed: 42
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15

  # Fusion ablation
  ablation:
    compare_modalities: True
    dynamic_weighting: True
    plain_fusion: True
    synthetic_noise_levels: [0.0, 0.1, 0.3, 0.5]
    synthetic_blur_levels: [0, 5, 15, 30]
    success_bar_relative_drop: 10.0  # percent